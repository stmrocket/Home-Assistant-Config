template:
  - sensor:
    - name: SMT Electricity Cost This Hour
      unique_id: 1a4dd41a-3f5e-4e74-bb9e-6372236690f1
      unit_of_measurement: '$'
      state: "{{ (states('sensor.smt_energy_hourly') | float(none) * states('input_number.smt_energy_cost') | float(none)) | round (2, default=none) }}"

    - name: SMT Electricity Cost Last Hour
      unique_id: 5b240de3-aae0-4c9d-beaf-3ee0fd0f477e
      unit_of_measurement: '$'
      state: "{{ (state_attr('sensor.smt_energy_hourly','last_period') | float(none) * states('input_number.smt_energy_cost') | float(none)) | round (2, default=none) }}"

    - name: SMT Electricity Cost Today
      unique_id: b5e868c8-9ab1-48b5-bbb2-32bd2e168934
      unit_of_measurement: '$'
      state: "{{ (states('sensor.smt_energy_daily') | float(none) * states('input_number.smt_energy_cost') | float(none)) | round (2, default=none) }}"

    - name: SMT Electricity Cost Yesterday
      unique_id: 691c6627-cc18-4cdf-9933-6de6c5dc782d
      unit_of_measurement: '$'
      state: "{{ (state_attr('sensor.smt_energy_daily','last_period') | float(none) * states('input_number.smt_energy_cost') | float(none)) | round (2, default=none) }}"

    - name: SMT Electricity Cost This Week
      unique_id: e310290d-a2e9-48de-bd63-6735b082c59f
      unit_of_measurement: '$'
      state: "{{ (states('sensor.smt_energy_weekly') | float(none) * states('input_number.smt_energy_cost') | float(none)) | round (2, default=none) }}"

    - name: SMT Electricity Cost Last Week
      unique_id: e67b69df-dbf7-4dbe-88c9-df41097fc974
      unit_of_measurement: '$'
      state: "{{ (state_attr('sensor.smt_energy_weekly','last_period') | float(none) * states('input_number.smt_energy_cost') | float(none)) | round (2, default=none) }}"

    - name: SMT Electricity Cost This Month
      unique_id: a2ecda2b-fdf4-4b26-bd71-9f9b552ede16
      unit_of_measurement: '$'
      state: "{{ (states('sensor.smt_energy_monthly') | float(none) * states('input_number.smt_energy_cost') | float(none)) | round (2, default=none) }}"

    - name: SMT Electricity Cost Last Month
      unique_id: 9ac19983-7a4e-4e2a-902e-a6b7daa21ef7
      unit_of_measurement: '$'
      state: "{{ (state_attr('sensor.smt_energy_monthly','last_period') | float(none) * states('input_number.smt_energy_cost') | float(none)) | round (2, default=none) }}"

    - name: SMT Electricity Cost This Year
      unique_id: 2261f6f9-eafa-4c9c-b7c3-5f48c26fab87
      unit_of_measurement: '$'
      state: "{{ (states('sensor.smt_energy_yearly') | float(none) * states('input_number.smt_energy_cost') | float(none)) | round (2, default=none) }}"

    - name: SMT Electricity Cost Last Year
      unique_id: 26ae00b9-32c3-4e0e-9c24-ec6e4367742c
      unit_of_measurement: '$'
      state: "{{ (state_attr('sensor.smt_energy_yearly','last_period') | float(none) * states('input_number.smt_energy_cost') | float(none)) | round (2, default=none) }}"

    - name: SMT Energy Last Hour
      unique_id: 1c59ecfc-ae31-4600-8df2-714fd75fcc15
      unit_of_measurement: 'kWh'
      state: "{{ state_attr('sensor.smt_energy_hourly','last_period') }}"

    
utility_meter:

  smt_energy_hourly:
    source: sensor.smt_current_reading
    cycle: hourly

  smt_energy_daily:
    source: sensor.smt_current_reading
    cycle: daily
    
  smt_energy_weekly:
    source: sensor.smt_current_reading
    cycle: weekly

  smt_energy_monthly:
    source: sensor.smt_current_reading
    cycle: monthly

  smt_energy_yearly:
    source: sensor.smt_current_reading
    cycle: yearly    
    
input_number:

  smt_energy_cost:
    name: Electricity Cost
    mode: box
    min: 0
    max: 2.50
    step: .001
    unit_of_measurement: "$/kWh"
