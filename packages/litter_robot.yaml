  - alias: Forbidden Forest Contents Detection
    id: 23adbc11-41bb-498d-a95b-b2e022138db7
    trigger:
      - platform: state
        entity_id: sensor.forbidden_forest_status_code
        from: "cst"
        to: "ccp"
    variables:
      image_time: "{{ now ().year }}_{{ now ().month }}_{{ now ().day }}_{{ now ().hour }}_{{ now ().minute }}"
    action:
