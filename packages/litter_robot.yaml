script:
  - siipet_reassign_last_visit:
    alias: "SiiPet - Reassign Last Visit"
    description: "Corrects an AI misidentification by shifting data between counters"
    fields:
      correct_cat:
        description: "The name of the cat who actually used the box"
        example: "Luna"
    sequence:
      # 1. Stop if the correct cat is already marked as the last processed cat
      - condition: template
        value_template: "{{ states('input_text.siipet_last_processed_cat') != correct_cat }}"
        
      # 2. Store variables locally for easier processing
      - variables:
          wrong_cat: "{{ states('input_text.siipet_last_processed_cat') | lower }}"
          right_cat: "{{ correct_cat | lower }}"
          duration: "{{ states('input_number.siipet_last_processed_duration') | float }}"

      # 3. Deduct the visit from the falsely accused cat
      - action: "counter.decrement"
        target:
          entity_id: "counter.{{ wrong_cat }}_visits"

      # 4. Give the visit to the correct cat
      - action: "counter.increment"
        target:
          entity_id: "counter.{{ right_cat }}_visits"
          
      # 5. Move the last duration metric to the correct cat
      - action: input_number.set_value
        target:
          entity_id: "input_number.{{ right_cat }}_last_duration"
        data:
          value: "{{ duration }}"

      # 6. Update the master tracker so you can't accidentally press it twice for the same event
      - action: input_text.set_value
        target:
          entity_id: input_text.siipet_last_processed_cat
        data:
          value: "{{ correct_cat }}"              