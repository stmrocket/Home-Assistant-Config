homeassistant:
  # Customization file
  customize: !include customize.yaml
  packages: !include_dir_named packages
  media_dirs:
    media: /config/media
  allowlist_external_dirs:
    - "/config/media/snapshots"
# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

http:
  use_x_forwarded_for: true
  trusted_proxies: 
    - !secret proxy_ip

frontend:
  themes: !include_dir_merge_named themes

# Enable Lovelace yaml mode
lovelace:
  dashboards:
    lovelace-kitchen:
      mode: yaml
      filename: lovelace-kitchen.yaml
      title: Kitchen Tablet
      show_in_sidebar: false
    lovelace-office:
      mode: yaml
      filename: lovelace-office.yaml
      title: Office Tablet
      show_in_sidebar: false
    lovelace-shack:
      mode: yaml
      filename: lovelace-shack.yaml
      title: Shack Tablet
      show_in_sidebar: false
    lovelace-den:
      mode: yaml
      filename: lovelace-den.yaml
      title: Den Tablet
      show_in_sidebar: false
    lovelace-master:
      mode: yaml
      filename: lovelace-master.yaml
      title: Master Bedroom Tablet
      show_in_sidebar: false
    lovelace-mobile:
      mode: yaml
      filename: lovelace-mobile.yaml
      title: Mobile Interface
      show_in_sidebar: false
    lovelace-entry:
      mode: yaml
      filename: lovelace-entry.yaml
      title: Entry Tablet
      show_in_sidebar: false
    lovelace-server:
      mode: yaml
      filename: lovelace-server.yaml
      title: Server Tablet
      show_in_sidebar: false    
    lovelace-crestron:
      mode: yaml
      filename: lovelace-crestron.yaml
      title: Crestron Wall Panels
      show_in_sidebar: false

python_script:

template:
  - sensor:
    - name: Blank
      unique_id: 73e72478-0522-4325-88d8-7b1d96832919
      state: ""
    - name: External URL
      unique_id: a0227421-19d4-43ba-b788-db5b8b78053b
      state: !secret ext_url
  - binary_sensor:
    - name: Is DST
      unique_id: 215e3ce8-25a1-429e-a4b6-bad9817a2e3c
      state: "{{ now().timetuple().tm_isdst > 0 }}"

input_boolean:
  timer_lights:
    name: Timer Lights
    icon: mdi:lightbulb

  outside_timer_lights:
    name: Outside Timer Lights
    icon: mdi:timer-outline

  master_lamp_timer:
    name: Master Lamp Timer
    icon: mdi:timer-outline

# Timers
timer:
  laundry_room:
    name: Laundry Room Light Timer
    duration: "00:02:00"

  master_closet:
    name: Master Closet Light Timer
    duration: "00:02:00"

  garage_light:
    name: Garage Lighting Timer
    duration: "00:10:00"

  blinds_after_shower_repeat:
    name: Repeat Prompt to Open Blinds After Shower
    duration: "00:05:00"

# Text to speech
tts:
  - platform: google_translate
    service_name: google_say

group: !include groups.yaml

automation: !include automations.yaml
automation manual: !include_dir_merge_list automation

script: !include_dir_merge_named scripts

scene: !include_dir_merge_named scenes

zone: !include zones.yaml

#Elk M1 Integration
elkm1:
  host: !secret elk_host
  username: !secret elk_user
  password: !secret elk_pass
  area:
    exclude: [3-8]
  counter:
    enabled: false
  keypad:
    enabled: false
  output:
    include: [3, 7, 9-16, 17-19, 177-180, 182-185, 197]
  setting:
    enabled: false
  task:
    enabled: false
  thermostat:
    enabled: false
  plc:
    enabled: false
  zone:
    exclude: [16, 35-36, 38-39, 54-64, 73-78, 81-196, 198-207]

# Alexa Integration
api:
alexa: !include alexa.yaml

remote_homeassistant:
  instances:

input_select:
  doorbell_tone:
    name: Doorbell Sound
    options:
      - Alexa Speak
      - Wish Upon A Star
      - Christmas
    icon: mdi:music